                <!-- # Tagline -->
                <h2 class="text-subhead">Steal treasure and evade the invincible minotaur in a 2D 4-player maze runner played on an arcade table!</h2>

                    <!-- # Project Duration -->
                    <h2 class="text-subhead"><i class="fa-solid fa-clock"></i>Jan - Apr 2026</h2>

                    <!-- # Role -->

                    <h2 class="text-subhead"><i class="fa-solid fa-computer"></i>Unity</h2>

            <section class="twin-grid">

                <p>
                    #

                    <div class="slide-arrow prev">

                    </div>

                        <span>&#10095;</span>
                    </div>
                    <div class="slide current"><img src="god-games-labyrinth/assets/fuse-picture-1.jpg" alt="fuse-pic-1"></div>
                    <div class="slide next"><img src="god-games-labyrinth/assets/fuse-picture-2.png" alt="fuse-pic-2"></div>
                    <div class="slide prev"><img src="god-games-labyrinth/assets/fuse-picture-3.jpg" alt="fuse-pic-3"></div>
                    <div class="slide"><img src="god-games-labyrinth/assets/fuse-picture-4.jpg" alt="fuse-pic-4"></div>
                    <div class="slide"><img src="god-games-labyrinth/assets/fuse-picture-5.jpg" alt="fuse-pic-5"></div>

        </div>

        <div class="container center-content">
            <!-- # Contributions -->
            <section class="contributions center-content">
                <h2 class="text-subhead">Individual Contributions: </h2>
                <ul>
