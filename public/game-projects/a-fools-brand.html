<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TODO#: Set Page Title-->
    <title>A Fool's Brand - Arcadia Koederitz's Portfolio</title>
    <!-- Font Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
        rel="stylesheet">

    <!-- Set Website Icon-->
    <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">

    <!-- Import FontAwesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Stylesheet Imports-->
    <link rel="stylesheet" href="/css/main.css" type="text/css">
    <link rel="stylesheet" href="/css/project.css" type="text/css">

    <!-- Import template HTML scripts -->
    <script src="/js/jquery.js" type="text/javascript"></script>
    <script src="/js/import.js" type="text/javascript"></script>
    <script src="/js/slideshow.js" type="text/javascript"></script>
</head>

<body>
    <div data-import="/imports/navbar" data-script="/js/navbar"></div>

    <!-- Page Content -->
    <div class="project page-content">
        <div class="container-s center-content">
            <section class="title center-content">
                <!-- # Title -->
                <h1 class="text-title">A Fool's Brand</h1>
                <!-- # Tagline -->
                <h2 class="text-subhead">You've has accrued massive debt to the casino and are forced to fight for your life in the betting
                arena to repay it.</h2>
                <!-- <img src="" alt="" class="fill-img"> -->
                <iframe src="https://www.youtube.com/embed/aTj6l765Q9Q?si=G2o9XNusQ_vUvvmb" frameborder="0" class="fill-img"></iframe>
            </section>

            <!-- # Download Link -->
            <section class="links center-content">
                <a href="https://blockoe1.itch.io/a-fools-brand" target="_blank" class="button">
                    Itch.io
                </a>
            </section>
    
            <!-- Info -->
            <section class="info">
                <div class="info-grid">
                    <!-- # Team Size -->
                    <h2 class="text-subhead"><i class="fa-solid fa-people-group"></i>5</h2>
                    <div class="divider"></div>
                    <!-- # Project Duration -->
                    <h2 class="text-subhead"><i class="fa-solid fa-clock"></i>May - June 2026</h2>
                    <div class="divider"></div>
                    <!-- # Role -->
                    <h2 class="text-subhead"><i class="fa-solid fa-id-badge"></i>Producer</h2>
                    <div class="divider"></div>
                    <!-- # Game Engine -->
                    <h2 class="text-subhead"><i class="fa-solid fa-computer"></i>Unity</h2>
                </div>
            </section>

            <section class="twin-grid">
                <!-- # Game Description -->
                <p>
                    #game-description
                </p>
                <!-- Slideshow -->
                <div class="slideshow">
                    <div class="slide-arrow prev">
                        <span>&#10094;</span>
                    </div>
                    <div class="slide-arrow next">
                        <span>&#10095;</span>
                    </div>
                    <div class="slide current"><img src="a-fools-brand/assets/screenshot-1.jpg" alt="screenshot-1"></div>
                    <div class="slide next"><img src="a-fools-brand/assets/screenshot-2.jpg" alt="screenshot-2"></div>
                    <div class="slide prev"><img src="a-fools-brand/assets/screenshot-3.jpg" alt="screenshot-3"></div>
                    <div class="slide"><img src="a-fools-brand/assets/screenshot-4.jpg" alt="screenshot-4"></div>
                    <div class="slide"><img src="a-fools-brand/assets/screenshot-5.jpg" alt="screenshot-5"></div>
                </div>
            </section>
        </div>

        <div class="container center-content">
            <!-- # Contributions -->
            <section class="contributions center-content">
                <h2 class="text-subhead">Individual Contributions: </h2>
                <ul>
                    <li>#<strong>contribution</strong></li>
                </ul>
            </section>
        </div>
    </div>

    <div data-import="/imports/footer"></div>
</body>

</html>
